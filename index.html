
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Dragon Cursor</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #c9c9c9;
      touch-action: none;
    }

    svg#screen {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #c9c9c9;
    }
  </style>
</head>
<body>

  <svg id="screen">
    <defs>
      <!-- Dragon Head -->
      <g id="Cabeza">
        <path d="M 0 -10 Q 35 0 25 10 Q -5 18 -15 0 Q -5 -18 0 -10 Z" fill="#000" />
        <circle cx="8" cy="-5" r="2.5" fill="#fff" />
        <circle cx="8" cy="5" r="2.5" fill="#fff" />
        <circle cx="9" cy="-5" r="1" fill="#000" />
        <circle cx="9" cy="5" r="1" fill="#000" />
        <path d="M -8 -8 Q -20 -18 -30 -12 Q -18 -5 -5 -4" fill="#000" />
        <path d="M -8 8 Q -20 18 -30 12 Q -18 5 -5 4" fill="#000" />
      </g>

      <!-- Dragon Wings -->
      <g id="Aletas">
        <path d="M 0 0 C -30 -60, -90 -120, -180 -90 C -120 -40, -60 -20, 0 0 Z" fill="#000" />
        <path d="M 0 0 C -30 60, -90 120, -180 90 C -120 40, -60 20, 0 0 Z" fill="#000" />
        <path d="M 0 0 C -20 -40, -70 -80, -140 -60" fill="none" stroke="#fff" stroke-width="1.5" />
        <path d="M 0 0 C -20 40, -70 80, -140 60" fill="none" stroke="#fff" stroke-width="1.5" />
        <path d="M 0 0 C -15 -25, -50 -50, -100 -35" fill="none" stroke="#fff" stroke-width="1" />
        <path d="M 0 0 C -15 25, -50 50, -100 35" fill="none" stroke="#fff" stroke-width="1" />
      </g>

      <!-- Dragon Spine/Bones -->
      <g id="Espina">
        <path d="M 0 0 C -15 -35, -50 -60, -80 -50 C -45 -20, -20 -8, 0 0 Z" fill="#000" />
        <path d="M 0 0 C -15 35, -50 60, -80 50 C -45 20, -20 8, 0 0 Z" fill="#000" />
        <circle cx="0" cy="0" r="3" fill="#000" />
      </g>
    </defs>
  </svg>

  <script>
    const screen = document.getElementById("screen");
    const xmlns = "http://www.w3.org/2000/svg";
    const xlinkns = "http://www.w3.org/1999/xlink";

    let width = window.innerWidth;
    let height = window.innerHeight;

    window.addEventListener("resize", () => {
      width = window.innerWidth;
      height = window.innerHeight;
    });

    const pointer = { x: width / 2, y: height / 2 };

    window.addEventListener("pointermove", (e) => {
      pointer.x = e.clientX;
      pointer.y = e.clientY;
    });

    window.addEventListener("touchmove", (e) => {
      if (e.touches.length > 0) {
        pointer.x = e.touches[0].clientX;
        pointer.y = e.touches[0].clientY;
      }
    });

    const N = 40;
    const elems = [];

    // Initialize elements array first
    for (let i = 0; i < N; i++) {
      elems[i] = { use: null, x: width / 2, y: height / 2 };
    }

    const prepend = (use, i) => {
      const elem = document.createElementNS(xmlns, "use");
      elems[i].use = elem;
      elem.setAttributeNS(xlinkns, "xlink:href", "#" + use);
      screen.appendChild(elem);
    };

    // Build Dragon segments
    for (let i = 0; i < N; i++) {
      if (i === 0) prepend("Cabeza", i);
      else if (i >= 7 && i <= 13) prepend("Aletas", i);
      else prepend("Espina", i);
    }

    const run = () => {
      requestAnimationFrame(run);

      let e = elems[0];
      e.x += (pointer.x - e.x) * 0.15;
      e.y += (pointer.y - e.y) * 0.15;

      for (let i = 1; i < N; i++) {
        let ep = elems[i - 1];
        e = elems[i];

        const a = Math.atan2(ep.y - e.y, ep.x - e.x);
        const targetDist = 12;

        e.x = ep.x - Math.cos(a) * targetDist;
        e.y = ep.y - Math.sin(a) * targetDist;

        let s = (1 - (i / N) * 0.75);
        if (i >= 7 && i <= 13) {
          s = 0.8 + (1 - Math.abs(i - 10) * 0.15) * 0.5;
        }

        e.use.setAttribute(
          "transform",
          translate(${e.x}, ${e.y}) rotate(${(180 / Math.PI) * a}) scale(${s}, ${s})
        );
      }

// Head angle tracking
      const headAngle = Math.atan2(pointer.y - elems[0].y, pointer.x - elems[0].x);
      elems[0].use.setAttribute(
        "transform",
        translate(${elems[0].x}, ${elems[0].y}) rotate(${(180 / Math.PI) * headAngle}) scale(1.1)
      );
    };

    run();
  </script>
</body>
        </html>
