<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Dragon Cursor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <svg id="screen">
    <defs>
      <!-- Head / Face / Eyes -->
      <g id="Cabeza">
        <path d="M 0 -10 Q 35 0 25 10 Q -5 18 -15 0 Q -5 -18 0 -10 Z" fill="#000" />
        <circle cx="8" cy="-5" r="2.5" fill="#fff" />
        <circle cx="8" cy="5" r="2.5" fill="#fff" />
        <circle cx="9" cy="-5" r="1" fill="#000" />
        <circle cx="9" cy="5" r="1" fill="#000" />
        <!-- Horns -->
        <path d="M -8 -8 Q -20 -18 -30 -12 Q -18 -5 -5 -4" fill="#000" />
        <path d="M -8 8 Q -20 18 -30 12 Q -18 5 -5 4" fill="#000" />
      </g>

      <!-- Wings / Aletas -->
      <g id="Aletas">
        <!-- Big Dragon Wings (Feathers & Fins) -->
        <path d="M 0 0 C -30 -60, -90 -120, -180 -90 C -120 -40, -60 -20, 0 0 Z" fill="#000" />
        <path d="M 0 0 C -30 60, -90 120, -180 90 C -120 40, -60 20, 0 0 Z" fill="#000" />
        <!-- Wing rib lines -->
        <path d="M 0 0 C -20 -40, -70 -80, -140 -60" fill="none" stroke="#fff" stroke-width="1.5" />
        <path d="M 0 0 C -20 40, -70 80, -140 60" fill="none" stroke="#fff" stroke-width="1.5" />
        <path d="M 0 0 C -15 -25, -50 -50, -100 -35" fill="none" stroke="#fff" stroke-width="1" />
        <path d="M 0 0 C -15 25, -50 50, -100 35" fill="none" stroke="#fff" stroke-width="1" />
      </g>

      <!-- Spine / Bones / Ribs -->
      <g id="Espina">
        <path d="M 0 0 C -15 -35, -50 -60, -80 -50 C -45 -20, -20 -8, 0 0 Z" fill="#000" />
        <path d="M 0 0 C -15 35, -50 60, -80 50 C -45 20, -20 8, 0 0 Z" fill="#000" />
        <circle cx="0" cy="0" r="3" fill="#000" />
      </g>
    </defs>
  </svg>

  <script src="script.js"></script>
</body>
          </html>
